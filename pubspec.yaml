name: costing_master
description: "Saree embroidery costing calculator for Gujarati workshops."
publish_to: 'none'

# versionName+versionCode for Android, CFBundleShortVersionString+CFBundleVersion for iOS.
version: 1.0.0+21

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  google_sign_in: ^6.2.1
  cloud_firestore: ^6.1.0
  firebase_storage: ^13.0.4
  flutter_riverpod: ^3.0.3
  connectivity_plus: ^6.0.5
  image_picker: ^1.1.2
  image_gallery_saver_plus: ^4.0.1
  path_provider: ^2.1.4
  share_plus: ^11.1.0
  animations: ^3.0.0
  uuid: ^4.4.2
  sembast: ^3.9.0
  dynamic_color: ^2.1.0
  url_launcher: ^6.3.3
  pdf: ^3.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  fake_cloud_firestore: ^4.4.0

flutter:
  uses-material-design: true
